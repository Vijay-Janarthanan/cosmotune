name: Native runtime diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel-mac:
    name: Intel Mac model and SQLite compatibility
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Load the packaged native runtimes and models
        run: ./gradlew :desktopApp:test --tests '*DesktopTargetRuntimeTest' --tests '*DesktopBeatModelTest' --info
      - name: Retain full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-mac-native-test-reports
          path: |
            desktopApp/build/test-results/test/*.xml
            desktopApp/build/reports/tests/
