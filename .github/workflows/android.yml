name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > cosmotune-release.jks
        {
          echo "storeFile=cosmotune-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew --max-workers=1 :app:assembleProdRelease :wearos:assembleProdRelease :tv:testProdDebugUnitTest :tv:assembleProdRelease

    - name: Verify OpenCanvas import and packaged models
      run: |
        python3 tools/verify-opencanvas-import.py --apk-dir app/build/outputs/apk/prod/release
        python3 tools/verify-recommendations.py --apk-dir app/build/outputs/apk/prod/release
        python3 tools/verify-wear-packaging.py --apk-dir app/build/outputs/apk/prod/release --wear-apk wearos/build/outputs/apk/prod/release/CosmotuneWear-prod-release.apk
        python3 tools/verify-opencanvas-import.py --apk-dir tv/build/outputs/apk/prod/release
        python3 tools/verify-recommendations.py --apk-dir tv/build/outputs/apk/prod/release
        python3 tools/verify-tv-packaging.py --apk-dir tv/build/outputs/apk/prod/release --phone-apk app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk
        python3 tools/verify-companion-imports.py

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cosmotune-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cosmotune-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
    - name: Upload TV APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cosmotune-tv-prod-release-signed
        path: tv/build/outputs/apk/prod/release/*.apk
