name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux · AppImage, deb, rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :sharedUi:jvmTest :video:jvmTest :manga:jvmTest :providers:jvmTest :remote:jvmTest :desktopApp:test :uiTests:test --continue -Pcosmotune.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pcosmotune.version=${{ steps.version.outputs.value }}

      - name: Upload Linux test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Cosmotune/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libcosmotune_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          modeljar=$(ls "$(dirname "$jar")"/shared-jvm*.jar)
          python3 tools/verify-recommendations.py --archive "$modeljar"

      - name: Build the AppImage
        run: |
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/Cosmotune \
            dist/Cosmotune-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/Cosmotune-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/Cosmotune-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows · installer, msi, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :sharedUi:jvmTest :video:jvmTest :manga:jvmTest :providers:jvmTest :remote:jvmTest :desktopApp:test :uiTests:test --continue "-Pcosmotune.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pcosmotune.version=${{ steps.version.outputs.value }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Cosmotune/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/cosmotune_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          modeljar=$(ls "$(dirname "$jar")"/shared-jvm*.jar)
          python tools/verify-recommendations.py --archive "$modeljar"
          # Windows media controls (WinRT) and the window/WASAPI bridge. The Gradle build configures
          # MinGW g++ and Ninja on Windows, so these come from smtc_abi.cpp and window_jni.cpp; a
          # missing compiler or header skips them quietly, which these two lines turn into a failure.
          jar tf "$jar" | grep -q 'native/cosmotune_smtc.dll'
          jar tf "$jar" | grep -q 'native/cosmotune_window.dll'

      - name: Upload Windows test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-test-reports
          path: |
            shared/build/test-results/jvmTest/*.xml
            desktopApp/build/test-results/test/*.xml
            uiTests/build/test-results/test/*.xml
            sharedUi/build/test-results/jvmTest/*.xml
            video/build/test-results/jvmTest/*.xml
            manga/build/test-results/jvmTest/*.xml
            providers/build/test-results/jvmTest/*.xml
            remote/build/test-results/jvmTest/*.xml
            desktopApp/build/reports/tests/

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/Cosmotune-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/Cosmotune-$v-windows-x64-setup.exe"
          7z a -tzip -mx=5 "dist/Cosmotune-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/Cosmotune/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS · dmg, pkg, zip (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :sharedUi:jvmTest :video:jvmTest :manga:jvmTest :providers:jvmTest :remote:jvmTest :desktopApp:test :uiTests:test --continue -Pcosmotune.version=${{ steps.version.outputs.value }}

      - name: Build DMG, PKG and the app bundle
        run: |
          ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg :desktopApp:createDistributable \
            -Pcosmotune.version=${{ steps.version.outputs.value }}

      - name: Upload macOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release-test-reports
          path: |
            shared/build/test-results/jvmTest/*.xml
            desktopApp/build/test-results/test/*.xml
            uiTests/build/test-results/test/*.xml
            sharedUi/build/test-results/jvmTest/*.xml
            video/build/test-results/jvmTest/*.xml
            manga/build/test-results/jvmTest/*.xml
            providers/build/test-results/jvmTest/*.xml
            remote/build/test-results/jvmTest/*.xml
            desktopApp/build/reports/tests/

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Cosmotune.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          modeljar=$(ls "$(dirname "$jar")"/shared-jvm*.jar)
          python3 tools/verify-recommendations.py --archive "$modeljar"

      - name: The app starts
        continue-on-error: true
        run: |
          app="desktopApp/build/compose/binaries/main/app/Cosmotune.app"
          "$app/Contents/MacOS/Cosmotune" > start.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then echo "still running after 25 s: ok"; kill "$pid"; else echo "the app exited early:"; cat start.log; exit 1; fi

      - name: Collect
        run: |
          v="${{ steps.version.outputs.value }}"
          arch="${{ matrix.arch }}"
          mkdir -p dist
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "dist/Cosmotune-$v-macos-$arch.dmg"
          done
          for f in desktopApp/build/compose/binaries/main/pkg/*.pkg; do
            [ -f "$f" ] && cp "$f" "dist/Cosmotune-$v-macos-$arch.pkg"
          done
          ditto -c -k --keepParent desktopApp/build/compose/binaries/main/app/Cosmotune.app "dist/Cosmotune-$v-macos-$arch.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*

  android-phone:
    name: Android · phone and watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: The signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without them the job would write an empty keystore and fail later inside R8 packaging with
          # a keystore error; the phone and watch must be signed with the same release key.
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Release signing secrets are not set:$missing"; exit 1; fi

      - name: Keystore and local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > cosmotune-release.jks
          {
            echo "storeFile=cosmotune-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - run: chmod +x gradlew

      - name: Build the signed phone and watch APKs
        run: ./gradlew --max-workers=1 :app:assembleProdRelease :wearos:assembleProdRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-phone-build
          path: app/build/outputs/apk/prod/release
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: android-watch-build
          path: wearos/build/outputs/apk/prod/release
          retention-days: 1

  android-tv:
    name: Android · TV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: The signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without them the job would write an empty keystore and fail later inside R8 packaging with
          # a keystore error; the phone and watch must be signed with the same release key.
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Release signing secrets are not set:$missing"; exit 1; fi

      - name: Keystore and local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > cosmotune-release.jks
          {
            echo "storeFile=cosmotune-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - run: chmod +x gradlew

      - name: Build the signed TV APKs
        run: ./gradlew --max-workers=1 :tv:testProdDebugUnitTest :tv:assembleProdRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv-build
          path: tv/build/outputs/apk/prod/release
          retention-days: 1

  android:
    name: Android · signed APKs
    needs: [android-phone, android-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/download-artifact@v4
        with:
          name: android-phone-build
          path: app/build/outputs/apk/prod/release
      - uses: actions/download-artifact@v4
        with:
          name: android-watch-build
          path: wearos/build/outputs/apk/prod/release
      - uses: actions/download-artifact@v4
        with:
          name: android-tv-build
          path: tv/build/outputs/apk/prod/release

      - name: Verify OpenCanvas import and packaged models
        run: |
          python3 tools/verify-opencanvas-import.py --apk-dir app/build/outputs/apk/prod/release
          python3 tools/verify-recommendations.py --apk-dir app/build/outputs/apk/prod/release
          python3 tools/verify-wear-packaging.py --apk-dir app/build/outputs/apk/prod/release --wear-apk wearos/build/outputs/apk/prod/release/CosmotuneWear-prod-release.apk
          python3 tools/verify-opencanvas-import.py --apk-dir tv/build/outputs/apk/prod/release
          python3 tools/verify-recommendations.py --apk-dir tv/build/outputs/apk/prod/release
          python3 tools/verify-tv-packaging.py --apk-dir tv/build/outputs/apk/prod/release --phone-apk app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk
          python3 tools/verify-companion-imports.py

      - name: Name and collect
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for f in app/build/outputs/apk/prod/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-prod-(.*)-release\.apk/\1/; s/app-prod-release\.apk/universal/')
            cp "$f" "dist/Cosmotune-$v-android-$abi.apk"
          done
          cp wearos/build/outputs/apk/prod/release/CosmotuneWear-prod-release.apk "dist/CosmotuneWear-$v.apk"
          cp "dist/CosmotuneWear-$v.apk" dist/CosmotuneWear.apk
          for f in tv/build/outputs/apk/prod/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/tv-prod-(.*)-release\.apk/\1/; s/tv-prod-release\.apk/universal/')
            cp "$f" "dist/CosmotuneTV-$v-android-$abi.apk"
            cp "$f" "dist/CosmotuneTV-android-$abi.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*

  web:
    name: Browser · player and helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build:site
        env:
          COSMOTUNE_SITE_ORIGINS: ${{ vars.COSMOTUNE_SITE_ORIGINS }}
          VITE_LISTEN_TOGETHER_SERVER: ${{ vars.LISTEN_TOGETHER_SERVER }}
      - name: Verify and collect browser packages
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          python3 tools/package-web.py --version "$v" --output dist
          # File names that stay the same from one version to the next, as the watch and TV packages have.
          cp "dist/Cosmotune-$v-web.zip" dist/Cosmotune-web.zip
          cp "dist/Cosmotune-$v-helper-chrome.zip" dist/Cosmotune-helper-chrome.zip
          cp "dist/Cosmotune-$v-helper-firefox.zip" dist/Cosmotune-helper-firefox.zip
      - uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: dist/*

  release:
    name: Publish
    needs: [linux, windows, macos, android, web]
    runs-on: ubuntu-latest
    steps:
      # Only the notes folder of the tagged commit: the release body (and so the in-app update dialogs, which show it)
      # is docs/releases/<version>.md when that file exists.
      - name: Check out the release notes
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4
        with:
          path: notes
          sparse-checkout: docs/releases
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - name: Choose the release body
        id: notes
        if: github.ref_type == 'tag'
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="notes/docs/releases/${TAG#v}.md"
          if [ -f "$notes" ]; then
            # The notes link relative to docs/releases; the release page and the update dialogs need absolute links.
            base="https://github.com/$REPO/blob/$TAG"
            sed -e "s#](\.\./\.\./#]($base/#g" -e "s#](\.\./#]($base/docs/#g" "$notes" > "$RUNNER_TEMP/release-body.md"
            echo "Release body: $notes"
            echo "path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$notes is not in the tagged commit, so the release gets GitHub's generated notes."
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add file names that stay the same from one version to the next
        run: |
          cd dist
          for f in Cosmotune-*; do
            stable=$(printf '%s' "$f" | sed -E 's/^Cosmotune-.*-(android|windows|linux|macos)-/Cosmotune-\1-/')
            if [ "$stable" != "$f" ] && [ ! -e "$stable" ]; then cp "$f" "$stable"; fi
          done

      - run: ls -lh dist

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cosmotune ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generated == 'true' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
